silver_tables:
  - entity: events
    schema:
      - name: id
        type: INT64
        mode: REQUIRED
        description: Event identifier
      - name: user_id
        type: INT64
        mode: REQUIRED
        description: User identifier (0 for invalid/null values)
      - name: event_order_in_session #Changed the column name for better readability
        type: INT64
        mode: NULLABLE
        description: Event sequence number within session
      - name: session_id
        type: STRING
        mode: REQUIRED
        description: Session identifier (UNKNOWN for nulls)
      - name: created_at
        type: TIMESTAMP
        mode: REQUIRED
        description: Event timestamp
      - name: ip_address
        type: STRING
        mode: REQUIRED
        description: IP address (UNKNOWN for nulls)
      - name: city
        type: STRING
        mode: REQUIRED
        description: City name (UNKNOWN for nulls)
      - name: state
        type: STRING
        mode: REQUIRED
        description: State code (UNKNOWN for nulls)
      - name: postal_code
        type: STRING
        mode: REQUIRED
        description: Postal code (UNKNOWN for nulls)
      - name: browser
        type: STRING
        mode: REQUIRED
        description: Browser name (UNKNOWN for nulls)
      - name: traffic_source
        type: STRING
        mode: REQUIRED
        description: Traffic source (UNKNOWN for nulls)
      - name: uri
        type: STRING
        mode: REQUIRED
        description: Page URI (UNKNOWN for nulls)
      - name: event_type
        type: STRING
        mode: REQUIRED
        description: Event type (UNKNOWN for nulls)
      - name: is_valid_id
        type: BOOLEAN
        mode: REQUIRED
        description: ID validation flag
      - name: is_valid_created_at
        type: BOOLEAN
        mode: REQUIRED
        description: Created timestamp validation flag
      - name: is_known_event_type
        type: BOOLEAN
        mode: REQUIRED
        description: Event type validation flag
      - name: ingestion_date
        type: DATE
        mode: REQUIRED
        description: Event ingestion date #added as all event types were not shown in the dim_event_type table
    partition:
      type: DAY
      field: created_at
    silver_table: silver.events
    silver_sql: silver/events.sql

  - entity: order_items
    schema:
      - name: order_item_id
        type: INT64
        mode: REQUIRED
        description: Unique identifier for order item
      - name: order_id
        type: INT64
        mode: NULLABLE
        description: Reference to parent order
      - name: user_id
        type: INT64
        mode: NULLABLE
        description: User who placed the order
      - name: product_id
        type: INT64
        mode: NULLABLE
        description: Product identifier
      - name: inventory_item_id
        type: INT64
        mode: NULLABLE
        description: Specific inventory item identifier
      - name: item_sale_price
        type: NUMERIC
        mode: NULLABLE
        description: Sale price of the item
      - name: order_status
        type: STRING
        mode: NULLABLE
        description: Order item status (Title Case)
      - name: order_created_at
        type: TIMESTAMP
        mode: NULLABLE
        description: When order item was created
      - name: shipped_at
        type: TIMESTAMP
        mode: NULLABLE
        description: When item was shipped
      - name: delivered_at
        type: TIMESTAMP
        mode: NULLABLE
        description: When item was delivered
      - name: returned_at
        type: TIMESTAMP
        mode: NULLABLE
        description: When item was returned
      - name: is_fully_completed
        type: BOOLEAN
        mode: REQUIRED
        description: Flag indicating if order item is complete
      - name: was_returned
        type: BOOLEAN
        mode: REQUIRED
        description: Flag indicating if item was returned
    partition:
      type: DAY
      field: order_created_at
    silver_table: silver.order_items
    silver_sql: silver/order_items.sql

  - entity: orders
    schema:
      - name: order_id
        type: INT64
        mode: NULLABLE
        description: Unique order identifier
      - name: user_id
        type: INT64
        mode: NULLABLE
        description: User who placed the order
      - name: status
        type: STRING
        mode: NULLABLE
        description: Order status
      - name: gender
        type: STRING
        mode: NULLABLE
        description: Gender associated with order
      - name: created_at
        type: TIMESTAMP
        mode: NULLABLE
        description: Order creation timestamp (formatted as string)
      - name: returned_at
        type: TIMESTAMP
        mode: NULLABLE
        description: Order return timestamp (formatted as string)
      - name: shipped_at
        type: TIMESTAMP
        mode: NULLABLE
        description: Order shipment timestamp (formatted as string)
      - name: TIMESTAMP
        type: STRING
        mode: NULLABLE
        description: Order delivery timestamp (formatted as string)
      - name: num_of_item
        type: INTEGER
        mode: NULLABLE
        description: Number of items in order
    partition:
      type: DAY
      field: created_at
    silver_table: silver.orders
    silver_sql: silver/orders.sql

  - entity: products
    schema:
      - name: product_id
        type: INT64
        mode: NULLABLE
        description: Unique product identifier
      - name: sku
        type: STRING
        mode: NULLABLE
        description: Stock keeping unit
      - name: product_name
        type: STRING
        mode: REQUIRED
        description: Product name (defaults to Unnamed Product)
      - name: brand_name
        type: STRING
        mode: REQUIRED
        description: Brand name (defaults to Unknown Brand)
      - name: product_category
        type: STRING
        mode: REQUIRED
        description: Product category (defaults to General)
      - name: department
        type: STRING
        mode: NULLABLE
        description: Product department
      - name: unit_cost
        type: NUMERIC
        mode: NULLABLE
        description: Cost per unit
      - name: retail_price
        type: NUMERIC
        mode: NULLABLE
        description: Retail selling price
      - name: dist_center_id
        type: INT64
        mode: NULLABLE
        description: Distribution center identifier
      - name: is_profitable
        type: BOOLEAN
        mode: NULLABLE
        description: Flag indicating if retail price exceeds cost
      - name: absolute_markup
        type: NUMERIC
        mode: NULLABLE
        description: Absolute price markup (retail_price - cost)
      - name: ingestion_ts
        type: TIMESTAMP
        mode: REQUIRED
        description: Timestamp when record was ingested
    silver_table: silver.products
    silver_sql: silver/products.sql

  - entity: users
    schema:
      - name: user_id
        type: INT64
        mode: NULLABLE
        description: Unique user identifier
      - name: full_name
        type: STRING
        mode: NULLABLE
        description: Concatenated first and last name
      - name: email_address
        type: STRING
        mode: NULLABLE
        description: Email address (lowercase)
      - name: age
        type: INT64
        mode: NULLABLE
        description: User age in years
      - name: age_group
        type: STRING
        mode: NULLABLE
        description: Age category (Under 18, 18-34, 35-54, 55+)
      - name: gender
        type: STRING
        mode: REQUIRED
        description: Gender (defaults to Not Specified)
      - name: city
        type: STRING
        mode: REQUIRED
        description: City name (defaults to Unknown City)
      - name: state
        type: STRING
        mode: REQUIRED
        description: State name (defaults to Unknown State)
      - name: country
        type: STRING
        mode: NULLABLE
        description: Country name
      - name: zip_code
        type: STRING
        mode: REQUIRED
        description: Postal code (defaults to N/A)
      - name: street_address
        type: STRING
        mode: REQUIRED
        description: Street address (defaults to UNKNOWN)
      - name: latitude
        type: BIGNUMERIC
        mode: REQUIRED
        description: Geographic latitude (defaults to 0.0)
      - name: longitude
        type: BIGNUMERIC
        mode: REQUIRED
        description: Geographic longitude (defaults to 0.0)
      - name: traffic_source
        type: STRING
        mode: NULLABLE
        description: Marketing traffic source
      - name: signup_timestamp
        type: TIMESTAMP
        mode: NULLABLE
        description: User account creation timestamp
      - name: ingestion_ts
        type: TIMESTAMP
        mode: REQUIRED
        description: Data ingestion timestamp
      - name: is_valid_email_format
        type: BOOLEAN
        mode: NULLABLE
        description: Email format validation flag
    silver_table: silver.users
    silver_sql: silver/users.sql

gold_tables:
  - name: dim_browser
    schema:
    - name: browser_key
      type: STRING
      mode: NULLABLE
    - name: browser_name
      type: STRING
      mode: NULLABLE
    sql: gold/dim_browser.sql
    destination: dim_browser

  - name: dim_event_type
    schema:
    - name: event_type_key
      type: STRING
      mode: NULLABLE
    - name: event_type
      type: STRING
      mode: NULLABLE
    sql: gold/dim_event_type.sql
    destination: dim_event_type
    
  - name: dim_date
    schema:
    - name: date_key
      type: STRING
      description: "Surrogate key generated with GENERATE_UUID()."
      mode: NULLABLE
    - name: date
      type: DATE
      description: "Calendar date."
      mode: NULLABLE
    - name: year
      type: INT64
      description: "Year (e.g., 2025)."
      mode: NULLABLE
    - name: quarter
      type: INT64
      description: "Quarter of the year (1–4)."
      mode: NULLABLE
    - name: year_quarter
      type: STRING
      description: "Formatted year and quarter (e.g., 2025-Q1)."
      mode: NULLABLE
    - name: month
      type: INT64
      description: "Month of the year (1–12)."
      mode: NULLABLE
    - name: year_month
      type: STRING
      description: "Formatted year and month (e.g., 2025-01)."
      mode: NULLABLE
    - name: month_name
      type: STRING
      description: "Full month name (e.g., January)."
      mode: NULLABLE
    - name: week_of_year
      type: INT64
      description: "Week number of the year (1–53)."
      mode: NULLABLE
    - name: year_week
      type: STRING
      description: "Formatted year and week (e.g., 2025-W01)."
      mode: NULLABLE
    - name: day_of_month
      type: INT64
      description: "Day of the month (1–31)."
      mode: NULLABLE
    - name: day_of_year
      type: INT64
      description: "Day of the year (1–366)."
      mode: NULLABLE
    - name: day_name
      type: STRING
      description: "Full day name (e.g., Monday)."
      mode: NULLABLE
    - name: day_of_week
      type: STRING
      description: "Day of week as stringified integer (0=Sunday, 1=Monday, ...)."
      mode: NULLABLE
    - name: is_weekday
      type: INT64
      description: "1 if weekday, 0 if weekend."
      mode: NULLABLE
    - name: is_holiday
      type: BOOL
      description: "True if the date is a holiday (currently defaults to false)."
      mode: NULLABLE
    - name: is_business_day
      type: BOOL
      description: "True if the date is a business day (currently defaults to false)."
      mode: NULLABLE
    sql: gold/dim_date.sql
    destination: dim_date 

